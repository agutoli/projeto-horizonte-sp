site_name: Projeto Horizonte
site_description: Rede pública de descoberta profissional e conexão com oportunidades
site_dir: site
docs_dir: site_docs

theme:
  name: material
  language: pt-BR
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Usar tema claro

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Apresentação:
      - Documento principal: proposal/documento-principal.md
      - Esboço para apresentação: proposal/esboco-apresentacao.md
      - Brief executivo: proposal/executive-brief.md
      - Perguntas e respostas: proposal/perguntas-e-respostas.md
  - Como funcionaria:
      - Modelo operacional: docs/04-modelo-operacional.md
      - Unidades móveis: docs/05-unidades-moveis.md
      - Central de Oportunidades: docs/07-central-de-oportunidades.md
      - Piloto em São Paulo: docs/10-piloto-sao-paulo.md
  - Viabilidade:
      - Parcerias: docs/12-parcerias-empresariais.md
      - Financiamento: docs/11-financiamento.md
      - Modelo econômico: docs/14-modelo-economico.md
      - Jurídico: docs/18-juridico.md
      - LGPD e menores: docs/19-lgpd-e-menores.md
  - Próximos passos:
      - Lacunas de pesquisa: research/lacunas-de-pesquisa.md
      - Infraestrutura existente: research/infraestrutura-existente.md
      - Riscos: docs/17-riscos.md
      - Roadmap: docs/21-roadmap.md
